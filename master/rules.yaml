rules:
  enabled:
    - DATE_VALID_NOT_FUTURE
    - IBAN_MATCHES_MASTER
    - IVA_CONSISTENT
    - NIF_IN_MASTER
    - NO_DOUBLE_PAYMENT
    - ORDER_BELONGS_TO_SUPPLIER
    - ORDER_PENDING
    - TOTALS_MUST_MATCH
thresholds:
  DATE_VALID_NOT_FUTURE:
    min_confidence: 0.6
  IBAN_MATCHES_MASTER:
    min_confidence: 0.7
  IVA_CONSISTENT:
    min_confidence: 0.6
  NIF_IN_MASTER:
    min_confidence: 0.7
  NO_DOUBLE_PAYMENT:
    min_confidence: 0.7
  ORDER_BELONGS_TO_SUPPLIER:
    min_confidence: 0.7
  ORDER_PENDING:
    min_confidence: 0.7
  TOTALS_MUST_MATCH:
    min_confidence: 0.7
outcomes:
  # Resultado del motor cuando una regla devuelve FAIL. Una regla rota NUNCA
  # paga: solo NO_PAGAR (negativo definitivo) o ESCALAR (duda razonable).
  # NIF/IBAN fuera del maestro pueden ser un proveedor nuevo: se escala, no se
  # descarta definitivamente. Cambiar esta frontera es una ADR.
  default: NO_PAGAR
  on_fail:
    NIF_IN_MASTER: ESCALAR
    IBAN_MATCHES_MASTER: ESCALAR
seleccion:
  # puntuación = confianza × peso del extractor; el field debe superarla para continuar.
  default_score_threshold: 0.3
  default_extractor_weights:
    override: 1.0
    pypdf: 1.0
    zxing: 1.0
    tesseract: 0.9
    vlm: 0.85
    cloud_vlm: 0.8
  # Desempate en empates de puntuación con valores distintos. `override` (la
  # corrección humana) va primero: gana el empate a puntuación 1.0. La garantía
  # se aplica también al ranking efectivo por field (ver escoger.field_selection).
  extractor_ranking: [override, pypdf, zxing, tesseract, vlm, cloud_vlm]
  fields:
    nif:
      format_tests: [NIF_FORMAT]
    iban:
      format_tests: [IBAN_FORMAT]
    pedido:
      format_tests: [PEDIDO_FORMAT]
    fecha:
      format_tests: [DATE_FORMAT]
      extractor_ranking: [override, pypdf, tesseract, vlm, cloud_vlm]
    total:
      format_tests: [AMOUNT_POSITIVE]
    base:
      format_tests: [AMOUNT_POSITIVE]
    iva_amount:
      format_tests: [AMOUNT_NON_NEGATIVE]
    iva_rate:
      format_tests: [AMOUNT_NON_NEGATIVE]
# BORRADOR regla v4 (sábado) — DESHABILITADA. Caso de uso: con el ERP actualizado
# (pedidos_nuevos.csv, pedidos en ABIERTO; AS-90001 ya PAGADA), Alberto añade la
# regla PEDIDO_EN_REVISION: si el pedido citado pasa a EN_REVISION en el ERP, la
# factura es duda razonable ⇒ ESCALAR (jamás PAGAR). Código real del histórico
# runner-1.0.0 (video/data_outcomes_lote1.jsonl: PEDIDO_EN_REVISION:UNKNOWN).
# El motor actual NO la soporta como datos: activarla exige ADR + código en
# src/filemaid/rules/rules.py (RULE_CODES/_RULE_IMPLS); tras medir su efecto
# sobre el lote, mover thresholds/outcomes a las secciones vivas, añadir el
# código a rules.enabled y fijar min_confidence con la distribución medida.
borrador_v4:
  enabled: false
  code: PEDIDO_EN_REVISION
  descripcion: >-
    FAIL si el pedido existe en el ERP pero su estado es EN_REVISION (no
    ABIERTO/PENDIENTE); UNKNOWN si el pedido no está o la lectura es dudosa.
  thresholds:
    min_confidence: 0.7
  outcomes:
    on_fail: ESCALAR  # duda razonable: escalar antes que pagar; JAMÁS PAGAR
