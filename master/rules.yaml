rules:
  enabled:
    - DATE_VALID_NOT_FUTURE
    - IBAN_MATCHES_MASTER
    - IVA_CONSISTENT
    - NIF_IN_MASTER
    - NO_DOUBLE_PAYMENT
    - ORDER_BELONGS_TO_SUPPLIER
    - ORDER_PENDING
    - TOTALS_MUST_MATCH
thresholds:
  DATE_VALID_NOT_FUTURE:
    min_confidence: 0.6
  IBAN_MATCHES_MASTER:
    min_confidence: 0.7
  IVA_CONSISTENT:
    min_confidence: 0.6
  NIF_IN_MASTER:
    min_confidence: 0.7
  NO_DOUBLE_PAYMENT:
    min_confidence: 0.7
  ORDER_BELONGS_TO_SUPPLIER:
    min_confidence: 0.7
  ORDER_PENDING:
    min_confidence: 0.7
  TOTALS_MUST_MATCH:
    min_confidence: 0.7
seleccion:
  # puntuación = confianza × peso del extractor; el field debe superarla para continuar.
  default_score_threshold: 0.3
  default_extractor_weights:
    pypdf: 1.0
    zxing: 1.0
    tesseract: 0.9
    vlm: 0.85
    cloud_vlm: 0.8
  # Desempate en empates de puntuación con valores distintos.
  extractor_ranking: [pypdf, zxing, tesseract, vlm, cloud_vlm]
  fields:
    nif:
      format_tests: [NIF_FORMAT]
    iban:
      format_tests: [IBAN_FORMAT]
    pedido:
      format_tests: [PEDIDO_FORMAT]
    fecha:
      format_tests: [DATE_FORMAT]
      extractor_ranking: [pypdf, tesseract, vlm, cloud_vlm]
    total:
      format_tests: [AMOUNT_POSITIVE]
    base:
      format_tests: [AMOUNT_POSITIVE]
    iva_amount:
      format_tests: [AMOUNT_NON_NEGATIVE]
    iva_rate:
      format_tests: [AMOUNT_NON_NEGATIVE]
