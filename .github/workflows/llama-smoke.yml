# Smoke de plataforma para el sidecar llama (rung 4): el binario se instala
# vía llama.app (auto CUDA/ROCm/Vulkan/Metal/CPU), el manager lo arranca bajo
# demanda y lo para. Verifica las rutas cross-platform: resolución de binario
# (PATH, PATHEXT en Windows, ~/.llama-app), spawn sin start_new_session en
# Windows, fallback sin `serve` para binarios clásicos, y no-huérfanos.
#
# No descarga el modelo (~1 GB): el test usa un GGUF mínimo sintético solo
# para comprobar la mecánica de proceso (fallará al cargar el modelo en el
# health-check, lo cual también ejercita la ruta de crash-detection).

name: llama-sidecar-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/albertitos/llama_manager.py"
      - "scripts/setup_llama.sh"
      - ".github/workflows/llama-smoke.yml"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install project (runtime deps only)
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Install llama.cpp (llama.app installer)
        shell: bash
        run: |
          if command -v llama >/dev/null 2>&1; then
            echo "llama already present"
          elif command -v sh >/dev/null 2>&1 && [ "$(uname -s)" != "MINGW"* ] && [ "$(uname -s)" != "MSYS"* ]; then
            curl -LsSf https://llama.app/install.sh | sh
          else
            echo "Windows: trying installer with curl.exe"
            curl.exe -LsSf https://llama.app/install.sh | sh || echo "INSTALL_FAILED"
          fi
          # ubicación para el fallback de _resolve_binary
          ls -la ~/.llama-app 2>/dev/null || true

      - name: Manager mechanics (no model needed)
        shell: bash
        env:
          ALBERTITOS_LLAMA_BIN: llama
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          from pathlib import Path
          from albertitos.llama_manager import LlamaSidecar, _resolve_binary

          bin_path = _resolve_binary("llama")
          print("resolved binary:", bin_path)
          assert bin_path is not None, "binary must resolve on this platform"

          # modelo inexistente: _prerequisites_ok debe fallar limpio (sin crash)
          mgr = LlamaSidecar(model=Path("nope.gguf"), mmproj=Path("nope.mmproj"),
                             log_dir=Path("data"))
          assert not mgr._prerequisites_ok(), "missing model must fail prerequisites"
          assert not mgr.ensure_started(), "ensure_started must return False, not raise"
          print("prerequisites/crash paths ok")

          # stop() en manager sin proceso: no-op seguro
          mgr.stop()
          print("safe stop ok")
          EOF

      - name: Ladder regression (no VLM deps required)
        shell: bash
        run: |
          pip install -e . pytest
          python -m pytest tests/test_extraccion.py tests/test_types.py -q
