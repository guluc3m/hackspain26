[project]
name = "filemaid"
version = "0.1.0"
description = "Decision system for Alberto's invoices (500 Sombras de Alberto)"
requires-python = ">=3.13"
dependencies = [
  "pypdf>=5",
  "pypdfium2>=4",
  "opencv-python-headless>=4.10",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pillow>=10",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pyyaml>=6.0.3",
  "zxing-cpp>=3.1.1",
]

[project.optional-dependencies]
# Ventana nativa opcional; Node sigue siendo requerido por PouchDB.
# Backend QT (PyQt6 +
# WebEngine, ruedas binarias: instalable sin raíz); GTK exigiría bibliotecas
# del sistema (PyGObject) no disponibles sin root.
desktop = ["pywebview[qt]>=5.4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "playwright>=1.63.0",
    "qrcode>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["src/filemaid/store/pouchdb/data", "src/filemaid/store/pouchdb/node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["src/filemaid"]

[tool.hatch.build.targets.wheel.force-include]
"src/filemaid/store/pouchdb/bridge.mjs" = "filemaid/store/pouchdb/bridge.mjs"
"src/filemaid/store/pouchdb/package.json" = "filemaid/store/pouchdb/package.json"
"src/filemaid/store/pouchdb/package-lock.json" = "filemaid/store/pouchdb/package-lock.json"

[project.scripts]
filemaid = "filemaid.run:main"
albertitos = "filemaid.run:main"
albertitos-desktop = "filemaid.desktop.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["caja-de-alberto"]

[tool.ruff.lint]
ignore = [
  "BLE001",
  "S110",
  "DTZ011",
]
