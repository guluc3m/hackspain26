[project]
name = "albertitos"
version = "0.1.0"
description = "Decision system for Alberto's invoices (500 Sombras de Alberto)"
requires-python = ">=3.13"
dependencies = [
  "pypdf>=5",
  "pypdfium2>=4",
  "opencv-python-headless>=4.10",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/albertitos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["caja-de-alberto"]
